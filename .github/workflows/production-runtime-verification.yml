name: Production Runtime Verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-runtime-verification.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: GET health
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 6 --retry-delay 5 https://text-metrics-runtime.vercel.app/api/metrics > /tmp/health.json
          cat /tmp/health.json
          node -e 'const x=require("/tmp/health.json"); if(x.status!=="ok"||x.service!=="text-metrics-runtime"||x.version!=="1.9.1") process.exit(1)'
      - name: POST deterministic metrics
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -H 'content-type: application/json' --data '{"text":"b a b a c"}' https://text-metrics-runtime.vercel.app/api/metrics > /tmp/basic.json
          cat /tmp/basic.json
          node - <<'NODE'
          const x=require('/tmp/basic.json');
          const got=x.frequency_top_500.map(v=>[v.token,v.count]);
          if(x.version!=='1.9.1'||JSON.stringify(got)!==JSON.stringify([['a',2],['b',2]])) process.exit(1);
          NODE
      - name: Unicode adversarial
        run: |
          set -euo pipefail
          curl --fail --show-error --silent -H 'content-type: application/json' --data '{"text":"😀 Học học 学 学"}' https://text-metrics-runtime.vercel.app/api/metrics > /tmp/unicode.json
          cat /tmp/unicode.json
          node - <<'NODE'
          const x=require('/tmp/unicode.json');
          const m=new Map(x.frequency_top_500.map(v=>[v.token,v.count]));
          if(x.utf8_bytes<=x.unicode_code_points||m.get('học')!==2||m.get('学')!==2) process.exit(1);
          NODE
      - name: Invalid input fails closed
        run: |
          set -euo pipefail
          code=$(curl --silent --output /tmp/bad.json --write-out '%{http_code}' -H 'content-type: application/json' --data '{"text":123}' https://text-metrics-runtime.vercel.app/api/metrics)
          cat /tmp/bad.json
          test "$code" = "400"
          node -e 'const x=require("/tmp/bad.json"); if(x.error!=="text_must_be_string") process.exit(1)'
      - name: Persist verified runtime evidence
        run: |
          mkdir -p verification
          node - <<'NODE'
          const fs=require('fs');
          const evidence={
            schema:"TM191-PRODUCTION-RUNTIME-VERIFICATION-v1",
            endpoint:"https://text-metrics-runtime.vercel.app/api/metrics",
            version:"1.9.1",
            get_health:"PASS",
            deterministic_post:"PASS",
            unicode_adversarial:"PASS",
            invalid_input_fail_closed:"PASS",
            production_runtime:"VERIFIED",
            github_run_id:process.env.GITHUB_RUN_ID,
            verified_commit:process.env.GITHUB_SHA
          };
          fs.writeFileSync('verification/production-runtime-verification.json',JSON.stringify(evidence,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification/production-runtime-verification.json
          git commit -m "test: record verified production runtime evidence"
          git push
